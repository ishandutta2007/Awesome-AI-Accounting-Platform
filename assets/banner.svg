<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="gridGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".15"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>.badge-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:50px;fill:url(#textGrad)}.subtitle{font-weight:500;font-size:22px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#38bdf8}.chart-line{stroke-dasharray:1000;stroke-dashoffset:1000;animation:dash 4s ease-out forwards infinite}</style><rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/><path stroke="url(#gridGrad)" stroke-width="1" d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250"/><path stroke="url(#gridGrad)" stroke-width="1" d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300 M 500 0 L 500 300 M 600 0 L 600 300 M 700 0 L 700 300 M 800 0 L 800 300 M 900 0 L 900 300 M 1000 0 L 1000 300 M 1100 0 L 1100 300"/><path fill="none" stroke="#818cf8" stroke-width="3" d="M 50 220 Q 200 260 350 180 T 650 160 T 950 90 T 1150 70" class="chart-line" opacity=".4"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 50 240 Q 250 190 450 220 T 750 120