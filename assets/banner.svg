<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 50px; fill: url(#textGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    .pulse-circle { animation: pulse 3s infinite alternate; }
    .chart-line { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: dash 4s ease-out forwards infinite; }
    @keyframes dash { to { stroke-dashoffset: 0; } }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines Background -->
  <path d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250" stroke="url(#gridGrad)" stroke-width="1"/>
  <path d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300 M 500 0 L 500 300 M 600 0 L 600 300 M 700 0 L 700 300 M 800 0 L 800 300 M 900 0 L 900 300 M 1000 0 L 1000 300 M 1100 0 L 1100 300" stroke="url(#gridGrad)" stroke-width="1"/>

  <!-- Animated Dynamic Background Chart Wave (Behind Text) -->
  <path class="chart-line" d="M 50 220 Q 200 260 350 180 T 650 160 T 950 90 T 1150 70" fill="none" stroke="#818cf8" stroke-width="3" opacity="0.4"/>
  <path class="chart-line" d="M 50 240 Q 250 190 450 220 T 750 120 T 1150 110" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>

  <!-- Decorative Glowing Nodes -->
  <circle cx="950" cy="90" r="6" fill="#c084fc" filter="url(#glow)"/>
  <circle cx="650" cy="160" r="5" fill="#818cf8" filter="url(#glow)"/>
  <circle cx="350" cy="180" r="5" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Foreground Content: Header Tag -->
  <g transform="translate(80, 65)">
    <rect width="210" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <text x="105" y="21" text-anchor="middle" class="badge-text">🤖 AI &amp; FINTECH ECOSYSTEM</text>
  </g>

  <!-- Foreground Content: Main Title -->
  <text x="80" y="145" class="title" filter="url(#glow)">Awesome AI Accounting Platform 📊</text>

  <!-- Foreground Content: Subtitle -->
  <text x="80" y="195" class="subtitle">Curated SaaS Products, Open-Source Repositories &amp; Autonomous Finance Tools</text>

  <!-- Bottom Stats Chips -->
  <g transform="translate(80, 230)">
    <!-- Chip 1 -->
    <rect width="170" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="15" y="20" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">✨ AI Bookkeeping</text>
    
    <!-- Chip 2 -->
    <rect x="185" width="180" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="200" y="20" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">⚡ Autonomous GL</text>

    <!-- Chip 3 -->
    <rect x="380" width="190" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="395" y="20" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🚀 Open-Source Ledgers</text>
  </g>
</svg>
